[project]
name = "salary-compass"
version = "1.0.0"
description = "Compare net income, cost-of-living and 10-year savings across European cities"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["salary", "relocation", "tax", "finance", "streamlit"]
authors = [{ name = "jenara19" }]
dependencies = [
  "streamlit>=1.32.0",
  "pyyaml>=6.0",
  "plotly>=5.18.0",
  "xlsxwriter>=3.1.9",
  "pandas>=2.0.0",
]

[project.urls]
Homepage   = "https://github.com/jenara19/salary_compass"
Repository = "https://github.com/jenara19/salary_compass"
Issues     = "https://github.com/jenara19/salary_compass/issues"
Changelog  = "https://github.com/jenara19/salary_compass/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "output"]

# ── Dev dependency group (uv-native — install with: uv sync --dev) ───────────
[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=2.0.0",
  "ruff>=0.4",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
  "openpyxl>=3.1",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "__pycache__", "dist", "build", ".eggs", ".ruff_cache"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
  "RUF", # ruff-specific
]
ignore = [
  "E501",   # line too long (formatter handles this)
  "B008",   # function calls in default args (common in Streamlit)
  "SIM108", # ternary operator (sometimes less readable)
  "RUF001", # ambiguous unicode in strings — intentional UI symbols (×, –, ℹ)
  "RUF002", # ambiguous unicode in docstrings — intentional math notation
  "RUF003", # ambiguous unicode in comments — intentional math notation
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "output"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true  # streamlit, plotly, xlsxwriter lack full stubs
show_error_codes = true
pretty = true



# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-v",
  "--tb=short",
  "--strict-markers",
  "--cov=engine",
  "--cov=output",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-report=html:htmlcov",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks integration tests",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["engine", "output"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
