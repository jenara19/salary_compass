special_schemes:
  - id: es_beckham_law
    name: "Beckham Law (Ley de Impatriados)"
    description: "New tax residents who relocate for work pay a flat 24% IRPF on income up to €600,000 (instead of progressive 24–47%). Valid for 6 years. Requires: 5+ years prior non-residency, employment contract with Spanish entity. Apply via Modelo 149 within 6 months of first payslip. Significant at €80k+ gross (breaks even vs standard at ~€72k). EU Digital Nomad Visa holders also eligible."
    duration_years: 6
    min_salary_annual: 72000
    type: flat_rate_override
    rate: 0.24
    warning: "Only beneficial above ~€72k gross. Below this level standard progressive IRPF is lower than 24%. Expires after 6 years — rate jumps to standard progressive rates. Consult a gestoría for Modelo 149 filing (€400–900)."

career:
  typical_cagr: 0.04
  note: "Spain tech market growing but structurally capped vs Northern Europe. Job hops yield 15-20% bumps."
