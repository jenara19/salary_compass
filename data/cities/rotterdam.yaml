name: Rotterdam
country: NL
currency: EUR
cost_of_living:
  rent_2bed:      {generous: 2700, comfortable: 2150, frugal: 1750, note: "Vrije sector (free market) only — social housing inaccessible for expats. Funda.nl May 2025: most 2-beds €2,000–2,700, outer areas €1,650+, Centrum/Kralingen €2,800–3,500. 1 month deposit typical (vs 2 in Amsterdam). Wet betaalbare huur (July 2024): 187+ WWS points = vrije sector; good new-build 2-beds score 190–210."}
  utilities:      {generous: 390, comfortable: 305, frugal: 240, note: "Electricity+gas (2-bed ~85m²): €135–225/month (Dutch 2025: ~€0.29/kWh, €1.10–1.40/m³ gas). Broadband (KPN/Ziggo): €38–55. 2× mobile SIM-only: €25–65. Water (Evides): ~€20/month fixed+variable. Rotterdam utilities ~15% cheaper than Amsterdam (Numbeo)."}
  health_extra:   {generous: 420, comfortable: 345, frugal: 300, note: "ZVW mandatory Dutch national insurance (same rates NL-wide). 2025 base per person: cheapest FBTO €145.95, mid Menzis €156, CZ €160, ONVZ €175+. Modest = 2× cheapest base only. Ample = 2× mid base + basic aanvullend (dental+physio €20/pp). Great = 2× premium + comprehensive aanvullend. Eigen risico €385/yr/person — deductible paid when care is used, not monthly."}
  groceries_2pax: {generous: 660, comfortable: 500, frugal: 380, note: "Modest: Lidl/Aldi primary + AH for fresh. comfortable: mixed AH/Jumbo. generous: full AH + Markthal specialty. Rotterdam groceries 5–20% cheaper than Amsterdam on most items."}
  transport_2pax: {generous: 250, comfortable: 170, frugal: 85, note: "RET monthly pass (metro/tram/bus unlimited, Rotterdam urban): ~€84/person. Modest = 1× RET pass + cycling for 2nd person (excellent infrastructure). Ample = 2× RET. Great = 2× RET + regular NS inter-city (Rotterdam–Amsterdam ~€18–22 single, 22 min Intercity Direct)."}
  eating_out:     {generous: 460, comfortable: 260, frugal: 100, note: "Numbeo mid-range dinner for 2 (3-course, no drinks): €80 (identical to Amsterdam). Markthal, Katendrecht, Witte de Withstraat dining. Modest = 2× cheap dinners/month; Ample = 4× mid-range; Great = 8×+ incl. upscale."}
  leisure:        {generous: 360, comfortable: 210, frugal: 100, note: "Basic Fit Rotterdam: €22–29/month. Trainmore: €40–55/month. Museumkaart: €69.95/year/person (Kunsthal €17, Depot Boijmans €20, SS Rotterdam €17). Cinema: €15/ticket. Euromast €14, Spido harbour tour €18."}
  misc:           {generous: 530, comfortable: 350, frugal: 200, note: "Clothing, personal care, household consumables, streaming (Netflix/Spotify ~€20–35), gifts. Includes Inboedelverzekering ~€12/month + Aansprakelijkheidsverzekering ~€5/month at ample tier."}
  travel:         {generous: 350, comfortable: 350, frugal: 350, fixed: true}
  personal:       {generous: 700, comfortable: 700, frugal: 700, fixed: true}
hidden_costs:
  - {name: "Gemeentebelasting Rotterdam (Afvalstoffenheffing + Rioolheffing)", annual: 600, mandatory: true}
  - {name: "Inboedelverzekering (contents insurance)", monthly: 12, mandatory: false}
  - {name: "Aansprakelijkheidsverzekering (liability insurance)", monthly: 5, mandatory: false}
  - {name: "Fietsverzekering (bike theft insurance)", monthly: 8, mandatory: false}
  - {name: "Quality city bike, 2× (one-time)", one_time: 1000, mandatory: true}
  - {name: "Kale apartment furnishing (one-time)", one_time: 6000, mandatory: false}
  - {name: "Rental deposit (1 month — lower than Amsterdam's 2)", one_time: 2150, mandatory: true}
career:
  market: "Rotterdam/Amsterdam BI & data"
  typical_cagr: 0.05
  ceiling_gross_eur: 130000
  note: "Anchored by Unilever, Shell, Coolblue, ABN AMRO, Robeco, Vopak, Port Authority. Slightly lower ceiling than Amsterdam tech cluster but abundant 30%/27%-ruling employers. CAGR ~5–7% post-COVID normalization."

permit:
  eu_eea:
    path: "Freedom of movement / no permit needed"
    timeline_weeks: 1
    steps:
      - "Register at Gemeente Rotterdam (BSN obtained same day or next day)"
      - "No work permit needed - EU free movement applies"
    notes: "Same national rules as Amsterdam. BSN required for banking, utilities, and employer tax setup. Rotterdam registration is generally faster than Amsterdam."
  non_eu:
    path: "Employer-sponsored Highly Skilled Migrant (HSM) permit"
    timeline_weeks: 7
    steps:
      - "Employer (IND-recognised sponsor) submits HSM/kennismigrant permit application to IND"
      - "IND processes combined residence + work permit (GVVA)"
      - "Non-exempt nationalities apply for MVV entry visa at Dutch embassy first"
      - "Arrive and register at Gemeente to obtain BSN"
    complexity: "low"
    sponsor_required: true
    costs_eur: 350
    notes: "Same as Amsterdam - NL national permit system. IND fast-track 2-4 weeks if employer is recognised sponsor. 30% ruling: file within 4 months of start date."
