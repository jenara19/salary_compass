name: Amsterdam
country: NL
currency: EUR
cost_of_living:
  rent_2bed:      {generous: 3000, comfortable: 2400, frugal: 1900, note: "Vrije sector only — social housing waitlist 10–15 years. Great = Canal belt/Jordaan/Zuid 70–90m². Ample = West/Oost/Watergraafsmeer 65–80m². Modest = Noord/Nieuw-West/Zuidoost outer boroughs. Numbeo: 1-bed centre €2,208; 3-bed centre €3,396 (2-bed interpolates ~€2,700–2,800 in centre). Deposit: 2 months bare rent. Makelaarskosten for tenants: BANNED since July 2023."}
  utilities:      {generous: 360, comfortable: 275, frugal: 215, note: "Electricity+gas: €155–210/month (ACM 2025: ~€0.34/kWh effective, gas €1.15–1.24/m³). Water (Waternet metered): ~€20/month. Broadband (Ziggo/KPN 250Mbps–1Gbps): €45–55. 2× SIM-only mobile (Odido/T-Mobile mid: €20/person; KPN premium €30). Numbeo 85m² utilities: €263/month (incl. heating+water+garbage)."}
  health_extra:   {generous: 410, comfortable: 355, frugal: 300, note: "ZVW mandatory Dutch national insurance (same rates NL-wide). 2025 base: cheapest FBTO €145.95/pp, mid a.s.r. €147.50, Anderzorg €152.25, Menzis €156.25, CZ €160, DSW €158.50. Modest = 2× cheapest base only (€296). Ample = 2× mid base (~€155) + basic aanvullend dental+physio (~€22/pp) = €354. Great = 2× premium + comprehensive aanvullend = €408. Eigen risico €385/yr/person."}
  groceries_2pax: {generous: 700, comfortable: 520, frugal: 380, note: "Modest: Lidl/Aldi/Dirk primary. comfortable: mixed AH + Jumbo/Dirk, household goods included. generous: mostly Albert Heijn + premium items. Amsterdam groceries ~10–15% above Dutch avg. AH Bonus card essential. Numbeo couple ex-rent ~€1,716/month all daily expenses."}
  transport_2pax: {generous: 250, comfortable: 165, frugal: 80, note: "GVB monthly pass (Amsterdam tram/bus/metro unlimited): €62.50/person. Modest = 1× GVB + 2 bike insurances + occasional pay-per-use NS. Ample = 2× GVB + 2 bike insurances (~€20) + occasional NS. Great = 2× GVB + NS Dal Voordeel (€10.60/month) + bike insurances + occasional Uber. Bikes ESSENTIAL — 80%+ cycle daily. 311+ bikes stolen daily in Amsterdam."}
  eating_out:     {generous: 950, comfortable: 600, frugal: 320, note: "Numbeo mid-range dinner for 2 (3-course, no drinks): €80 (range €65–140). Inexpensive restaurant/person: €20. Beer 0.5L: €6. Cappuccino: €4.05. Amsterdam restaurant prices 15–20% above Dutch avg. Happy hours 17:00–19:00 common. Modest = 1–2 casual outings/week; Ample = 1 mid-range dinner + 1–2 casual/week; Great = 2–3 restaurant dinners/week + bars."}
  leisure:        {generous: 380, comfortable: 175, frugal: 75, note: "Basic-Fit: ~€25–30/month/person. Trainmore (Amsterdam-native): €39–49/person. David Lloyd (Amstelveen/Zuidas): €80–100/person. Museumkaart: €69/year/person (free Rijksmuseum, Van Gogh, Anne Frank etc.). Cinema: €15/ticket (Pathé/Vue). Cineville unlimited pass: ~€20/month. Paradiso/Melkweg: €15–30 entry."}
  misc:           {generous: 400, comfortable: 180, frugal: 90, note: "Clothing, personal care, gifts, subscriptions, household consumables. Does NOT include insurance (in hidden_costs). Streaming services ~€15–35/month."}
  travel:         {generous: 350, comfortable: 350, frugal: 350, fixed: true}
  personal:       {generous: 700, comfortable: 700, frugal: 700, fixed: true}
hidden_costs:
  - {name: "Afvalstoffenheffing Amsterdam (waste disposal levy)", annual: 395, mandatory: true}
  - {name: "Rioolheffing Amsterdam (sewerage charge, gebruikersheffing)", annual: 190, mandatory: true}
  - {name: "Inboedelverzekering (contents insurance)", monthly: 12, mandatory: false}
  - {name: "Aansprakelijkheidsverzekering (liability insurance)", monthly: 5, mandatory: false}
  - {name: "Fietsverzekering 2× bikes (theft insurance — Amsterdam essential)", monthly: 18, mandatory: false}
  - {name: "Kale apartment furnishing (one-time)", one_time: 6000, mandatory: false}
  - {name: "Rental deposit 2 months bare rent (ample tier)", one_time: 4800, mandatory: true}
career:
  market: "Amsterdam tech & finance hub"
  typical_cagr: 0.055
  ceiling_gross_eur: 150000
  note: "Booking.com, Adyen, ASML, Uber, Netflix, TomTom. Strongest BI/data market in NL. 30%→27% ruling still very significant. Lead/staff data roles €90–130k; Director/VP up to €180k+."

permit:
  eu_eea:
    timeline: "1–3 weeks"
    steps:
      - "Register at city hall (DigiD + BSN — can be obtained same day at Gemeente)"
      - "No work permit needed — EU free movement applies"
      - "Optional: apply for BSN on Day 1 to unlock banking and utilities faster"
  non_eu:
    timeline: "8–14 weeks"
    steps:
      - "Employer applies for TWV (tewerkstellingsvergunning) at UWV"
      - "IND processes combined residence + work permit (GVVA)"
      - "Non-exempt nationalities: apply for MVV visa at Dutch embassy first"
  complexity: medium
  sponsor_required: true
  costs_eur: 0
  notes: "EU/EEA: free movement — just register. 30% ruling application: file with employer within 4 months of start date; backdating only to employment start. Non-EU: employer bears full permit cost. IND decisions typically 8–14 weeks; priority track (€1,400) available. Highly skilled migrant permit fast-track (5 weeks) available if salary above €5,688/mo (2026 threshold)."
